<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Юный астронавт: База</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Учебная игра: управляй базой на Луне или Марсе и балансируй кислород, воду, еду, энергию и защиту от радиации.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: mission-control console. Left = stores, centre = live view of the base, right = power bus; crew tasks below. Single deliberate dark theme (space). */
:root{
  --bg:#080b14; --bg2:#0d1220; --panel:#111829; --panel2:#162036; --line:#24304a; --line2:#2f3d5c;
  --fg:#e9eef8; --muted:#97a2ba; --dim:#6a7591;
  --acc:#8fb8ff; --acc-ink:#0a1222;
  --ok:#4fd08f; --warn:#f5b84a; --bad:#ff6363; --o2:#7fd3ff; --water:#4c9bff; --food:#8ddc6a; --power:#ffd35a; --rad:#d38bff; --hp:#ff8fa3;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; color-scheme:dark;
}
:root[data-planet="mars"]{ --acc:#ff8a5c; --acc-ink:#1c0b04; }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font:700 18px/1.15 var(--f-display);margin:0;letter-spacing:.01em}
.brand .sub{color:var(--muted);font-size:13px}
.daybox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.daycount{display:flex;align-items:baseline;gap:8px}
.daycount .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.daycount .big{font:700 26px/1 var(--f-mono)}
.daycount .of{color:var(--dim);font:500 15px var(--f-mono)}
.track{display:flex;gap:3px}
.track i{width:9px;height:18px;border-radius:2px;background:var(--line);display:block}
.track i.done{background:var(--acc);opacity:.55}
.track i.now{background:var(--acc)}
.track i.flare{box-shadow:inset 0 -4px 0 var(--rad)}
.track i.dark{box-shadow:inset 0 4px 0 var(--muted)}
.btn{border:1px solid var(--line2);background:var(--panel);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{font:700 16px/1 var(--f-display);padding:16px 22px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* alerts */
.alerts{display:flex;gap:8px;flex-wrap:wrap}
.alert{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.alert b{font-weight:600}
.alert.bad{border-color:color-mix(in srgb,var(--bad) 60%,transparent);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.alert.good{border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.alert.bad .dot{color:var(--bad)} .alert.warn .dot{color:var(--warn)} .alert.good .dot{color:var(--ok)} .alert.info .dot{color:var(--acc)}

/* main grid */
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.scenecol{grid-column:1/-1;order:-1}}
@media (max-width:720px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h2{font:700 12px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .hint{font:500 11px var(--f-body);letter-spacing:0;text-transform:none;color:var(--dim)}

/* meters */
.meters{display:flex;flex-direction:column;gap:12px}
.meter{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;align-items:center}
.meter svg{width:20px;height:20px}
.meter .name{font-size:14px;font-weight:500}
.meter .val{font:700 14px var(--f-mono);text-align:right;white-space:nowrap}
.meter .val small{font-weight:500;color:var(--dim)}
.meter .bar{grid-column:2/4;height:8px;border-radius:4px;background:var(--bg2);position:relative;overflow:hidden;border:1px solid var(--line)}
.meter .bar span{position:absolute;inset:0 auto 0 0;border-radius:3px;transition:width .4s ease}
.meter .bar .ghost{opacity:.35}
.meter .bar .limit{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.meter .fc{grid-column:2/4;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.fc .d{font-family:var(--f-mono)}
.fc .up{color:var(--ok)} .fc .down{color:var(--warn)} .fc .crit{color:var(--bad);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font:700 17px var(--f-mono)}
.stat .v small{font-size:12px;color:var(--dim);font-weight:500}

/* scene */
.scenecol{display:flex;flex-direction:column;gap:14px;min-width:0}
.scene{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/8.4;max-width:100%}
.scene canvas{display:block;width:100%;height:100%}
.scene .tag{position:absolute;left:12px;top:12px;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);padding:5px 8px;border-radius:6px;color:#e9eef8}
.scene .tag2{left:auto;right:12px}
.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.tip .who{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font:700 13px var(--f-display);color:var(--acc)}
.tip p{margin:2px 0 0;font-size:14px}
.tip .t{font-weight:600;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}

/* power */
.supply{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:12px}
.supply div{display:flex;justify-content:space-between;gap:8px}
.supply b{color:var(--fg);font-family:var(--f-mono)}
.sys{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:7px}
.sys .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sys .nm{font-weight:600;font-size:14px}
.sys .kw{font:700 13px var(--f-mono);color:var(--power)}
.sys .ds{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--bg2);padding:3px;border-radius:8px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 0;font:600 12px var(--f-mono);color:var(--muted);cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.seg button:hover:not([aria-pressed="true"]){background:var(--panel2);color:var(--fg)}
.sys.off .nm::after{color:var(--bad);font-weight:500}
.sys.off .nm::after{content:attr(data-off)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn.lang{font:700 12px var(--f-mono);letter-spacing:.06em;padding:6px 10px;min-width:44px;min-height:36px}
.demo-btn{font-size:15px}
h1 .demo{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 6px;vertical-align:middle}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:6px;cursor:pointer}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--acc)}
.live .btn{margin-top:2px}
.live span{display:block}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.coach{position:relative;z-index:30;outline:3px solid var(--acc);outline-offset:3px;border-radius:var(--r);box-shadow:0 0 0 9999px rgba(3,5,12,.55)}
.coachbox{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;width:min(440px,calc(100vw - 32px));background:var(--panel2);border:1px solid var(--acc);border-radius:12px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.coachbox .cstep{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.coachbox p{margin:6px 0 12px}

.balance{margin-top:6px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.bbar{position:relative;height:14px;background:var(--bg2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bbar .p{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--power) 70%,transparent)}
.bbar .d{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
.bline{display:flex;justify-content:space-between;font-size:13px;gap:8px;flex-wrap:wrap}
.bline .res{font:700 14px var(--f-mono)}

/* actions */
.actions h2{margin-bottom:10px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.act{text-align:left;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:100%}
.act:hover:not(:disabled){border-color:var(--acc)}
.act[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg2));box-shadow:0 0 0 1px var(--acc) inset}
.act:disabled{opacity:.42;cursor:not-allowed}
.act .an{font-weight:600;font-size:14px;line-height:1.25}
.act .ad{font-size:12.5px;color:var(--muted);line-height:1.35}
.act .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:3px}
.chip{font:600 11px var(--f-mono);border:1px solid var(--line2);border-radius:5px;padding:2px 6px;color:var(--muted);white-space:nowrap}
.chip.eva{color:var(--rad);border-color:color-mix(in srgb,var(--rad) 45%,transparent)}
.chip.why{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.endrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:720px){.endrow{position:sticky;bottom:0;background:var(--panel);margin-inline:-14px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -10px 20px rgba(0,0,0,.35)}.endrow .btn.big{flex:1}}
.codebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.codebox input{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;color:var(--fg);font:600 14px var(--f-mono);padding:8px 10px;width:130px;text-transform:uppercase}
.hist svg{width:100%;height:110px;display:block}
.hist .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.hist .lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.endrow .sel{font-size:14px;color:var(--muted)} .endrow .sel b{color:var(--fg)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(3,5,10,.78);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:760px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px;max-height:calc(100dvh - 32px);overflow-y:auto}
.dlg>*{flex-shrink:0}
.dlg h2{font:700 24px/1.2 var(--f-display);margin:0;text-wrap:balance}
.dlg h3{font:700 13px/1.2 var(--f-display);margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dlg p{margin:0}
.dlg .lead{color:var(--muted);font-size:15px;max-width:62ch}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.planets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.planets{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line2);background:var(--bg2);border-radius:14px;padding:0;cursor:pointer;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.pcard:hover{border-color:var(--pc)}
.pcard canvas{width:100%;height:120px;display:block}
.pcard .pb{padding:14px;display:flex;flex-direction:column;gap:6px}
.pcard .pn{font:700 18px var(--f-display)}
.pcard ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.pcard .go{margin-top:6px;font-weight:600;color:var(--pc)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:620px){.steps{grid-template-columns:1fr}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.modes{grid-template-columns:1fr}}
.mode{border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--muted)}
.mode b{color:var(--fg);font-size:14.5px}
.mode[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;background:color-mix(in srgb,var(--acc) 12%,var(--bg2))}
.gloss{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg2)}
.gloss summary{cursor:pointer;font-weight:600}
.gloss dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:10px 0 0;font-size:13.5px}
.gloss dt{font-weight:600} .gloss dd{margin:0;color:var(--muted)}
@media (max-width:520px){.gloss dl{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}}
.live{border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:13.5px;background:var(--bg2)}
.live b{color:var(--acc)}
.steps div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.steps b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}
.rep{display:flex;flex-direction:column;gap:10px}
.deltas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dl{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.dl .k{font-size:12px;color:var(--muted)}
.dl .v{font:700 15px var(--f-mono)}
.dl .v.up{color:var(--ok)} .dl .v.down{color:var(--warn)} .dl .v.crit{color:var(--bad)}
.ev{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg2)}
.ev.bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.ev.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.ev.good{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.ev .et{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.ev.bad .et .dot{color:var(--bad)} .ev.warn .et .dot{color:var(--warn)} .ev.good .et .dot{color:var(--ok)} .ev.info .et .dot{color:var(--acc)}
.real{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;border:1px dashed color-mix(in srgb,var(--rad) 60%,transparent);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
.real .rk{grid-column:1/-1;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--rad)}
.real .rv{grid-row:2/5;font:700 26px/1 var(--f-mono);color:var(--fg)}
.real .rn{color:var(--fg)} .real .rs{font-size:12px}
.why{border-left:3px solid var(--acc);padding:6px 10px;background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:0 6px 6px 0;font-size:13.5px;color:var(--fg)}
.why b{color:var(--acc);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.stars{display:flex;gap:6px}
.stars svg{width:34px;height:34px}
.endstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.lessons{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.src{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.src li span{color:var(--muted)}
.src a{color:var(--acc)}
table.data{border-collapse:collapse;width:100%;font-size:13.5px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.data th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
table.data td.n{font-family:var(--f-mono);white-space:nowrap}
.tblwrap{overflow-x:auto}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.seed{font:500 12px var(--f-mono);color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app" aria-live="off"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ============================================================
   LANGUAGE
   ============================================================ */
let LANG = 'ru';
try { const q = new URLSearchParams(location.search).get('lang'); LANG = q || localStorage.getItem('outpost-lang') || ((navigator.language||'').startsWith('ru') ? 'ru' : 'en'); } catch(e) {}
if(LANG!=='ru' && LANG!=='en') LANG = 'ru';
const L = (ru, en) => LANG==='en' ? en : ru;
const tr = x => (x && typeof x==='object' && 'ru' in x) ? x[LANG] : x;
function setLang(l){ LANG = l; try{ localStorage.setItem('outpost-lang', l); }catch(e){} document.documentElement.lang = l; document.title = L('Юный астронавт: База','Junior Astronaut: Outpost'); }

/* ============================================================
   DATA — real-world anchors (see the "Science" screen)
   ============================================================ */
const CREW = 4;
const O2_PER = 0.84;          // kg O2 per person per day — NASA BVAD
const FOOD_PER = 1.8;         // kg food per person per day incl. packaging — NASA BVAD
const WATER_GROSS = 10;       // L per person per day: drinking, food prep, hygiene (simplified)
const RECOVERY = 0.90;        // ISS ECLSS ~93%, 98% since 2023
const O2_SYS_KWH = 20, O2_SYS_KG = 3.6, O2_WATER_PER_KG = 1.125; // electrolysis: 9 g water -> 8 g O2
const WATER_SYS_KWH = 8;
const GH_KWH = 12, GH_FOOD = 1.6, GH_O2 = 0.4;
const DOSE_LIMIT = 100;       // game mission limit, mSv
const SHIELD = [1, 0.7, 0.45, 0.3, 0.2]; // dose multiplier per regolith layer (~0.5 m each)
const BAT_START_CAP = 100, BAT_ADD = 60, O2_CAP = 60;
const SCIENCE_GOAL = 6;

const PLANETS = {

const S_NAME = s => s===0 ? L('нет протонной бури','no proton storm') : `S${s}`;
function solarDate(d){ const [y,m,dd] = d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString(LANG==='en'?'en-GB':'ru-RU',{day:'numeric',month:'long',year:'numeric', timeZone:'UTC'}); }

/* ---------- Communication delay from real orbits (JPL approximate Keplerian elements, J2000) ---------- */
function helio(a,e,L0,Ldot,w,T){ const d2r=Math.PI/180; const M=((L0+Ldot*T-w)%360)*d2r; let E=M; for(let k=0;k<8;k++) E = E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
  const x=a*(Math.cos(E)-e), y=a*Math.sqrt(1-e*e)*Math.sin(E); const wr=w*d2r; return [x*Math.cos(wr)-y*Math.sin(wr), x*Math.sin(wr)+y*Math.cos(wr)]; }
function marsDistAU(date){ const T = (date.getTime()/86400000 + 2440587.5 - 2451545.0)/36525;
  const E = helio(1.00000261,0.01671123,100.46457166,35999.37244981,102.93768193,T);
  const M = helio(1.52371034,0.09339410,-4.55343205,19140.30268499,-23.94362959,T);
  return Math.hypot(M[0]-E[0], M[1]-E[1]); }
const MARS_AU = marsDistAU(new Date());
const DELAY_MARS = MARS_AU * 499.005 / 60;
function delayText(pid){ return pid==='moon' ? L('1,3 секунды','1.3 seconds') : L(`${Math.round(DELAY_MARS)} мин`, `${Math.round(DELAY_MARS)} min`); }

/* ---------- seeded RNG so a mission can be replayed in class ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rint(rng,a,b){return a+Math.floor(rng()*(b-a+1))}

let LIVE = null; // {event, fetchedAt} when a real recent flare was fetched from NASA DONKI

function makeSchedule(pid, seed){
  const rng = mulberry32(seed*7919+13);
  // every mission gets at least one real proton storm; the other event may be a "bright but harmless" flare
  const storms = SOLAR.filter(x=>x.s>0);
  const a = storms[rint(rng,0,storms.length-1)];
  const rest = SOLAR.filter(x=>x!==a); const b = rest[rint(rng,0,rest.length-1)];
  const ev = rng()<0.5 ? [a,b] : [b,a];
  if(pid==='moon') return { dark:[rint(rng,5,8), rint(rng,12,15)], darkLens:[2,2], flares:[rint(rng,4,7), rint(rng,11,17)], ev };
  return { dark:[rint(rng,6,9), rint(rng,14,16)], darkLens:[5,3], flares:[rint(rng,4,7), rint(rng,12,17)], ev };
}
const DEMO_SEED = 7777;
function demoSchedule(pid){
  const big = SOLAR.find(x=>x.date==='2003-10-28'), quiet = SOLAR.find(x=>x.date==='2014-10-24');
  return pid==='moon' ? { dark:[5,13], darkLens:[2,2], flares:[3,9], ev:[big, quiet] } : { dark:[5,14], darkLens:[4,2], flares:[3,9], ev:[big, quiet] };
}

function newState(pid, seed, mode, opts={}){
  const P = PLANETS[pid];
  seed = seed || (Math.floor(Math.random()*9000)+1000);
  mode = mode || 'cadet';
  const sched = opts.demo ? demoSchedule(pid) : makeSchedule(pid, seed);
  if(opts.live && LIVE) sched.ev[0] = LIVE;
  return { pid, seed, mode, demo:!!opts.demo, day:1, battery:60, batCap:BAT_START_CAP, o2:P.o2, water:P.water, food:P.food, parts:P.parts,
    health:100, dose:0, science:0, data:0, leak:false, panels: mode==='cadet' ? P.cadetPanels : P.panels, gh:2, ghBroken:0, shield:1, reactor:false, recyclerBroken:false,
    dust:0, lv:{o2:100, water:100, heat:100, farm:100, comm:0}, action:'rest', sched,
    over:null, stats:{blackouts:0, coldDays:0, hungryDays:0, evas:0, flaresTaken:[], vented:0, wasted:0, builds:0, repairs:0},
    history:[], lastCause:null };
}

function darkLenAt(s, i){ return (s.sched.darkLens && s.sched.darkLens[i]) || PLANETS[s.pid].darkLen; }
function isDark(s, day){ return s.sched.dark.some((st,i)=> day>=st && day<st+darkLenAt(s,i)); }
function isFlare(s, day){ return s.sched.flares.includes(day); }
function flareOn(s, day){ const k = s.sched.flares.indexOf(day); return k<0 ? null : s.sched.ev[k]; }
function flareDose(s, day, shield){ const f = flareOn(s, day); if(!f) return 0; return f.dose * PLANETS[s.pid].flareMul * SHIELD[shield ?? s.shield]; }

const ACT = Object.fromEntries(ACTIONS.map(a=>[a.id,a]));
const val = (x,s)=> typeof x==='function' ? x(s) : tr(x);
function actionBlock(s, a){
  if(a.only && a.only!==s.pid) return 'hide';
  if(a.eng && s.mode==='cadet') return 'hide';
  const r = a.avail && a.avail(s); if(r) return r;
  if(a.parts > s.parts) return L(`Нужно запчастей: ${a.parts}`,`Needs ${a.parts} spare parts`);
  return null;
}

/* ============================================================
   SIMULATION — one day. Same function drives the forecast and the real turn.
   ============================================================ */
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function simulate(s0){
  const s = clone(s0), P = PLANETS[s.pid], A = ACT[s.action] || ACT.rest;
  const eng = s.mode !== 'cadet';
  const info = {};
  if(A.parts) s.parts -= A.parts;
  switch(A.id){
    case 'panel': s.panels++; break;
    case 'battery': s.batCap += BAT_ADD; break;
    case 'greenhouse': s.gh++; break;
    case 'shield': s.shield = Math.min(4, s.shield+1); break;
    case 'repair': s.ghBroken = 0; s.recyclerBroken = false; s.leak = false; break;
    case 'clean': s.dust = 0; break;
    case 'reactor': s.reactor = true; break;
    case 'science': s.data += 1; break;
  }
  const dark = isDark(s, s.day);
  const sun = (dark ? P.darkFactor : 1) * (1 - s.dust);
  info.sun = sun; info.dark = dark;
  info.solar = s.panels * P.panel * sun;
  info.nuc = s.reactor ? 40 : 0;
  info.prod = info.solar + info.nuc;
  const ghOn = eng ? Math.max(0, s.gh - s.ghBroken) : 0;
  const dem = {
    o2: O2_SYS_KWH * s.lv.o2/100,
    water: (!eng || s.recyclerBroken) ? 0 : WATER_SYS_KWH * s.lv.water/100,
    heat: P.heat * s.lv.heat/100,
    farm: GH_KWH * ghOn * s.lv.farm/100,
    comm: COMM_KWH[s.pid] * s.lv.comm/100,
    task: A.energy || 0
  };
  info.dem = dem;
  info.demand = dem.o2 + dem.water + dem.heat + dem.farm + dem.comm + dem.task;
  const avail = info.prod + s.battery;
  let k = 1; info.blackout = false; info.wasted = 0;
  const bat0 = s.battery;
  if(info.demand > avail + 1e-9){ k = info.demand>0 ? avail/info.demand : 1; s.battery = 0; info.blackout = true; }
  else { s.battery = s.battery + info.prod - info.demand; if(s.battery > s.batCap){ info.wasted = s.battery - s.batCap; s.battery = s.batCap; } }
  info.k = k; info.batDelta = s.battery - bat0;
  const f = { o2: s.lv.o2/100*k, water: s.recyclerBroken?0:s.lv.water/100*k, heat: s.lv.heat/100*k, farm: s.lv.farm/100*k, comm: s.lv.comm/100*k };
  info.f = f;
  info.o2Made = O2_SYS_KG * f.o2; info.o2Plants = GH_O2 * ghOn * f.farm; info.o2Use = O2_PER*CREW;
  info.o2Leak = s.leak ? 1.5 : 0;
  s.o2 += info.o2Made + info.o2Plants - info.o2Use - info.o2Leak;
  info.vented = 0; if(s.o2 > O2_CAP){ info.vented = s.o2 - O2_CAP; s.o2 = O2_CAP; }
  const gross = WATER_GROSS*CREW;
  info.waterBack = RECOVERY * f.water * gross;
  info.waterElec = info.o2Made * O2_WATER_PER_KG;
  info.waterIce = A.id==='ice' ? 60 : 0;
  info.foodMade = GH_FOOD * ghOn * f.farm; info.foodUse = FOOD_PER*CREW;
  if(eng){
    s.water += -(gross - info.waterBack) - info.waterElec + info.waterIce;
    s.food += info.foodMade - info.foodUse;
  }
  info.sent = Math.min(s.data, f.comm);
  s.data -= info.sent; s.science += info.sent;
  if(s.data < 1e-6) s.data = 0;
  const sf = SHIELD[s.shield];
  info.doseBg = P.bgDose * sf; info.doseEva = A.eva ? P.eva : 0; info.doseFlare = flareDose(s, s.day);
  info.dose = info.doseBg + info.doseEva + info.doseFlare;
  s.dose += info.dose;
  let dh = 0; const causes = [];
  if(f.heat < 0.999){ dh -= Math.round((1-f.heat)*30); causes.push('cold'); }
  if(s.food < 0){ s.food = 0; dh -= 15; causes.push('hunger'); }
  if(s.water < 0){ s.water = 0; dh -= 25; causes.push('thirst'); }
  if(A.id==='rest') dh += 10;
  if(!causes.length) dh += 3;
  info.dh = dh; info.causes = causes;
  s.health = Math.max(0, Math.min(100, s.health + dh));
  if(s.o2 <= 0){ s.o2 = 0; s.over = 'o2'; }
  else if(s.dose >= DOSE_LIMIT){ s.over = 'dose'; }
  else if(s.health <= 0){ s.over = 'health'; s.lastCause = causes[0] || 'cold'; }
  return { s, info };
}

/* Real turn: simulate, then roll tomorrow's events. */
function endDay(){
  const before = clone(S);
  const { s, info } = simulate(S);
  const P = PLANETS[s.pid], dn = tr(P.dayName).toLowerCase();
  const rng = mulberry32(s.seed*1009 + s.day*97);
  const ev = [];
  const A = ACT[s.action];
  if(info.blackout) s.stats.blackouts++;
  if(info.causes.includes('cold')) s.stats.coldDays++;
  if(info.causes.includes('hunger')) s.stats.hungryDays++;
  if(A.eva) s.stats.evas++;
  if(['panel','battery','greenhouse','shield','reactor'].includes(A.id)) s.stats.builds++;
  if(A.id==='repair') s.stats.repairs++;
  s.stats.vented += info.vented; s.stats.wasted += info.wasted;

  if(isFlare(s, s.day)){
    const fl = flareOn(s, s.day);
    s.stats.flaresTaken.push({dose:+info.doseFlare.toFixed(1), cls:fl.cls, date:fl.date, s:fl.s});
    const storm = fl.s>0;
    ev.push({tone: info.doseFlare>30?'bad':storm?'warn':'good', real:fl,
      title: storm ? L(`Вспышка ${fl.cls} и протонная буря ${S_NAME(fl.s)}`,`Flare ${fl.cls} and an ${S_NAME(fl.s)} proton storm`) : L(`Вспышка ${fl.cls} без протонной бури`,`Flare ${fl.cls} with no proton storm`),
      text: storm ? L(`Экипаж укрылся в модуле. Доза от бури: ${fmt(info.doseFlare)} мЗв. Без реголита было бы ${fmt(flareDose(s,s.day,0))}. Слоёв реголита: ${s.shield}.`,`The crew sheltered in the habitat. Storm dose: ${fmt(info.doseFlare)} mSv. Without regolith it would be ${fmt(flareDose(s,s.day,0))}. Regolith layers: ${s.shield}.`)
                  : L('Вспышка была яркой, но протонов почти не пришло. Доза почти не выросла.','The flare was bright, but almost no protons arrived. The dose barely changed.'),
      why: storm ? (s.pid==='moon' ? L('Свет и рентген от вспышки долетают за 8 минут и почти безвредны внутри модуля. Опасны протоны, которые приходят потом. У Луны нет атмосферы и магнитного поля, поэтому базу засыпают грунтом.','Light and X-rays from a flare arrive in 8 minutes and are mostly harmless inside the habitat. The danger is the protons that follow. The Moon has no air and no magnetic field, so bases are buried under soil.')
                                     : L('Тонкая атмосфера Марса задерживает часть протонов, но глобального магнитного поля нет. Прибор RAD на Curiosity измеряет радиацию на поверхности Марса с 2012 года.','Mars’s thin air stops some protons, but the planet has no global magnetic field. The RAD instrument on Curiosity has measured surface radiation since 2012.'))
                 : L('Протонная буря случается только тогда, когда выброс с Солнца разгоняет частицы и они летят в нашу сторону. Поэтому учёные следят не только за вспышками, но и за потоком протонов.','A proton storm happens only when an eruption accelerates particles and they head our way. That is why scientists watch proton flux, not just flares.')});
  }
  if(info.blackout) ev.push({tone:'bad', title:L('Нехватка энергии','Power shortage'), text:L(`Батарея опустела, все системы работали только на ${Math.round(info.k*100)}% мощности.`,`The battery ran flat. Every system ran at only ${Math.round(info.k*100)}% power.`),
      why:L('На настоящей базе инженеры заранее решают, что отключать первым. Сначала жертвуют тем, что может подождать, а кислород и тепло берегут до последнего.','On a real base, engineers decide in advance what to switch off first. Things that can wait go first; oxygen and heat are protected to the end.')});
  if(info.causes.includes('cold')) ev.push({tone:'warn', title:L('В модуле холодно','The habitat is cold'), text:L('Обогреву не хватило энергии, экипаж мёрзнет и слабеет.','Heating did not get enough power. The crew is cold and getting weaker.'), why: s.pid==='moon' ? L('В тени на Луне бывает −170 °C и ниже. Тепло уходит в космос излучением, поэтому модуль надо всё время греть.','In shadow the Moon can drop below −170 °C. Heat radiates away into space, so the habitat must be heated all the time.') : L('Средняя температура на Марсе около −60 °C. Атмосфера слишком тонкая, чтобы держать тепло.','Mars averages about −60 °C. The air is too thin to hold heat.')});
  if(info.causes.includes('hunger')) ev.push({tone:'bad', title:L('Закончилась еда','Out of food'), text:L('Экипаж голодает: здоровье падает каждый день.','The crew is hungry: health drops every day.'), why:L('Астронавту нужно около 1,8 кг еды в день вместе с упаковкой. Для Марса еду придётся выращивать на месте.','An astronaut needs about 1.8 kg of food a day including packaging. On Mars, food will have to be grown locally.')});
  if(info.causes.includes('thirst')) ev.push({tone:'bad', title:L('Закончилась вода','Out of water'), text:L('Воды нет, экипажу очень плохо.','No water left. The crew is in a bad way.'), why:L('Вода нужна для питья, еды, гигиены и для получения кислорода. Поэтому на МКС перерабатывают почти всю воду, даже пот и мочу.','Water is needed for drinking, food, hygiene and making oxygen. That is why the ISS recycles nearly all its water, even sweat and urine.')});
  if(info.vented>0.05) ev.push({tone:'info', title:L('Баки кислорода полны','Oxygen tanks are full'), text:L(`Лишние ${fmt(info.vented)} кг O₂ не поместились. Можно убавить электролиз и сэкономить энергию.`,`${fmt(info.vented)} kg of extra O₂ did not fit. You could turn electrolysis down and save power.`)});
  if(info.wasted>1) ev.push({tone:'info', title:L('Батарея полна','Battery is full'), text:L(`${fmt(info.wasted,0)} кВт·ч энергии пропало зря. ${s.mode==='cadet'?'Можно было включить радио или построить аккумулятор.':'Можно было отдать их теплице или построить аккумулятор.'}`,`${fmt(info.wasted,0)} kWh went to waste. ${s.mode==='cadet'?'You could have used the radio or built a battery.':'You could have powered the greenhouse or built a battery.'}`)});
  if(info.sent>0.01) ev.push({tone:'good', title:L('Данные ушли на Землю','Data sent to Earth'), text:L(`Передано: ${fmt(info.sent)}. Всего на Земле: ${fmt(s.science)} из ${SCIENCE_GOAL}. Сигнал идёт ${delayText(s.pid)}.`,`Sent: ${fmt(info.sent)}. Total at Earth: ${fmt(s.science)} of ${SCIENCE_GOAL}. The signal takes ${delayText(s.pid)}.`)});
  if(A.id==='science') ev.push({tone:'good', title:L('Новые научные данные','New science data'), text: s.data>0.01 ? L(`Данные ждут отправки: ${fmt(s.data)}. Включи радиосвязь, иначе Земля их не получит.`,`Data waiting to be sent: ${fmt(s.data)}. Turn on the radio or Earth will never get it.`) : L('Данные сразу ушли на Землю по радио.','The data went straight to Earth by radio.'),
      why: s.pid==='moon' ? L('В кратерах у южного полюса Луны есть области вечной тени. Там миллиарды лет хранится водяной лёд.','Craters near the lunar south pole hold regions of permanent shadow, where water ice has been stored for billions of years.') : L('Марсоход Perseverance собирает образцы в кратере Езеро, где когда-то было озеро. В них ищут следы древней жизни.','The Perseverance rover collects samples in Jezero crater, once a lake. Scientists search them for signs of ancient life.')});
  if(A.id==='reactor') ev.push({tone:'good', title:L('Реактор запущен','Reactor online'), text:L('Теперь база получает 40 кВт·ч в день при любой погоде.','The base now gets 40 kWh a day in any weather.'), why:L('NASA разрабатывает проект Fission Surface Power: небольшой ядерный реактор около 40 кВт для Луны. Ему не нужно Солнце.','NASA’s Fission Surface Power project is a small ~40 kW nuclear reactor for the Moon. It does not need sunlight.')});
  if(A.id==='shield') ev.push({tone:'good', title:L(`Слой реголита №${s.shield}`,`Regolith layer #${s.shield}`), text:L(`Теперь радиация внутри модуля в ${fmt(1/SHIELD[s.shield],1)} раза слабее, чем без защиты.`,`Radiation inside is now ${fmt(1/SHIELD[s.shield],1)} times weaker than with no shielding.`), why:L('Использовать местные материалы выгоднее, чем везти всё с Земли: запуск каждого килограмма стоит тысячи долларов.','Using local materials beats shipping everything from Earth: launching each kilogram costs thousands of dollars.')});
  if(A.id==='clean') ev.push({tone:'good', title:L('Панели чистые','Panels clean'), text:L('Выработка солнечной энергии восстановлена.','Solar output is back to full.')});
  if(A.id==='ice') ev.push({tone:'good', title:L('Лёд добыт','Ice mined'), text:L('+60 л воды. Из неё можно получить и кислород.','+60 L of water, which can also become oxygen.'), why: s.pid==='moon' ? L('Прибор NASA M3 на индийском аппарате Chandrayaan-1 подтвердил водяной лёд в затенённых кратерах у полюсов Луны.','NASA’s M3 instrument on India’s Chandrayaan-1 confirmed water ice in shadowed craters near the lunar poles.') : L('Аппарат MRO увидел под равниной Утопия слой льда: по объёму почти как озеро Верхнее.','The MRO orbiter found ice under Utopia Planitia holding about as much water as Lake Superior.')});
  if(P.cargo.includes(s.day)){
    s.food += 25; s.water += 40; s.parts += 4;
    ev.push({tone:'good', title:L('Прилетел грузовой корабль','A cargo ship arrived'), text: s.mode==='cadet' ? L('+4 запчасти.','+4 spare parts.') : L('+25 кг еды, +40 л воды, +4 запчасти.','+25 kg food, +40 L water, +4 spare parts.'), why:L('До Луны лететь около 3 дней, поэтому базу можно снабжать с Земли. До Марса 6–9 месяцев, а окно старта открывается раз в 26 месяцев.','The Moon is about 3 days away, so Earth can resupply it. Mars is 6–9 months away, with a launch window every 26 months.')});
  }

  const t = s.day + 1;
  if(!s.over && t <= P.days){
    if(s.day >= 3){
      const r = rng();
      if(r < P.meteor){
        s.o2 = Math.max(0.1, s.o2 - 5); s.leak = true;
        const ghHit = s.mode!=='cadet' && s.gh - s.ghBroken > 0; if(ghHit) s.ghBroken++;
        ev.push({tone:'bad', title:L('Удар микрометеорита','Micrometeoroid strike'), text:L(`Утекло 5 кг кислорода, и через пробоину уходит ещё 1,5 кг в день.${ghHit?' Теплица тоже пробита.':''} Нужен ремонт.`,`5 kg of oxygen escaped and 1.5 kg more leaks out every day.${ghHit?' A greenhouse was hit too.':''} Repair needed.`), why:L('У Луны нет атмосферы, в которой сгорают мелкие метеориты. Песчинка летит быстрее пули, поэтому модули закрывают многослойным щитом Уиппла, как на МКС.','The Moon has no air to burn up tiny meteoroids. A grain of sand flies faster than a bullet, so modules use layered Whipple shields, like the ISS.')});
      } else if(s.mode!=='cadet' && r < P.meteor + P.fail && !s.recyclerBroken){
        s.recyclerBroken = true;
        ev.push({tone:'bad', title:L('Сломалась очистка воды','Water recycler broke'), text:L('Пока её не починят, вода не возвращается в оборот и запас тает в разы быстрее.','Until it is fixed, no water is recovered and the supply drains many times faster.'), why:L('Система на МКС возвращает около 98% воды. Без неё запас тает очень быстро, поэтому на борту держат запчасти.','The ISS system recovers about 98% of water. Without it supplies vanish fast, so spare parts are kept on board.')});
      } else if(s.pid==='mars' && s.dust>0.08 && r > 0.88){
        s.dust = 0;
        ev.push({tone:'good', title:L('Ветер очистил панели','Wind cleaned the panels'), text:L('Порыв ветра сдул пыль, панели снова работают на полную.','A gust blew the dust away; panels are back to full power.'), why:L('Марсоходы Spirit и Opportunity не раз «оживали», когда ветер сдувал пыль с их панелей.','The Spirit and Opportunity rovers were revived more than once when wind blew dust off their panels.')});
      }
    }
    if(s.pid==='mars') s.dust = Math.min(0.45, s.dust + P.dustRate*(isDark(s,t)?2:1));
    if(isFlare(s,t)){
      const fl = flareOn(s,t);
      ev.push({tone:'warn', real:fl, title:L(`Завтра: солнечная вспышка`,`Tomorrow: a solar flare`), text:L(`Обсерватории видят опасную группу пятен. Вспышка ожидается в ${dn} ${t}. Возможная доза при нынешней защите: до ${fmt(flareDose(s,t))} мЗв. С ещё одним слоем реголита: ${fmt(flareDose(s,t,Math.min(4,s.shield+1)))}.`,`Observatories see a dangerous sunspot group. A flare is expected on ${dn} ${t}. Possible dose with current shielding: up to ${fmt(flareDose(s,t))} mSv. With one more regolith layer: ${fmt(flareDose(s,t,Math.min(4,s.shield+1)))}.`),
        why:L('За Солнцем следят обсерватории SDO и SOHO. Свет вспышки долетает за 8 минут, а протонам нужно от получаса до нескольких часов. Этого хватает, чтобы укрыться.','Observatories such as SDO and SOHO watch the Sun. Flare light arrives in 8 minutes; protons take from half an hour to several hours. That is enough time to take shelter.')});
    }
    if(isDark(s,t) && !isDark(s,s.day)){
      const i = s.sched.dark.indexOf(t); const len = i>=0 ? darkLenAt(s,i) : P.darkLen;
      ev.push({tone:'warn', title: L(`Завтра: ${tr(P.darkName).toLowerCase()} на ${len} ${plural(len,'день','дня','дней')}`,`Tomorrow: ${tr(P.darkName).toLowerCase()} for ${len} ${s.pid==='mars'?'sols':'days'}`), text:L(`Панели дадут только ${Math.round(P.darkFactor*100)}% энергии. Запаси энергию в батарее или реши, что отключить.`,`Panels will give only ${Math.round(P.darkFactor*100)}% power. Fill the battery or decide what to switch off.`),
        why: s.pid==='moon' ? L('На южном полюсе Солнце висит низко, и тени от гор тянутся на километры. Базу ставят на гребни с почти постоянным светом, но и там бывают дни в тени.','At the south pole the Sun hangs low and mountain shadows stretch for kilometres. Bases sit on ridges with near-constant light, but even there some days are shadowed.') : L('Марсианские бури закрывают Солнце на дни и даже месяцы. В 2018 году буря оставила марсоход Opportunity без энергии, и он больше не вышел на связь.','Martian storms can block the Sun for days or months. In 2018 a storm cut off power to the Opportunity rover and it never called home again.')});
    }
  }

  s.history.push({ day:s.day, o2:s.o2, water:s.water, food:s.food, battery:s.battery, batCap:s.batCap, health:s.health, dose:s.dose });
  const reportDay = s.day;
  if(!s.over){ if(s.day >= P.days) s.over = 'win'; else s.day++; }
  const blk = actionBlock(s, ACT[s.action]); if(blk) s.action = 'rest';
  S = s;
  render();
  showReport(before, s, info, ev, reportDay);
}

function fmt(n, d=1){ return Number(n).toLocaleString(LANG==='en'?'en-US':'ru-RU',{maximumFractionDigits:d, minimumFractionDigits:0}); }
function sgn(n, d=1){ const r = Number(n.toFixed(d)); return (r>0?'+':r<0?'−':'±') + fmt(Math.abs(r), d); }
function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
function esc(t){ return String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const U = { kg:()=>L('кг','kg'), l:()=>L('л','L'), kwh:()=>L('кВт·ч','kWh'), msv:()=>L('мЗв','mSv') };

  water:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2C10 2 4 9 4 12.5a6 6 0 0 0 12 0C16 9 10 2 10 2z" fill="var(--water)"/></svg>',
  food:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 3.5C8 3.5 3.5 7.5 3.5 13c0 1.3.3 2.4.8 3.3C6 12 9 9.5 12.5 8 9.5 10 7 13 5.6 17.3c.9.5 2 .7 3.2.7 5.8 0 7.7-6.3 7.7-14.5z" fill="var(--food)"/></svg>',
  hp:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17.5S2.5 13 2.5 7.6A4 4 0 0 1 10 5.5a4 4 0 0 1 7.5 2.1C17.5 13 10 17.5 10 17.5z" fill="var(--hp)"/></svg>',
  rad:'<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="1.8" fill="var(--rad)"/><path d="M10 10 6.2 3.4A7.6 7.6 0 0 1 13.8 3.4zM10 10l7.6 0a7.6 7.6 0 0 1-3.8 6.6zM10 10l-3.8 6.6A7.6 7.6 0 0 1 2.4 10z" fill="var(--rad)"/></svg>',
};

let S = null;
const app = document.getElementById('app');
const modalRoot = document.getElementById('modalRoot');

function meterHTML({name, icon, value, unit, max, color, delta, digits=1, inverse=false, limit=null, note=''}){
  const pct = Math.max(0, Math.min(100, value/max*100));
  const next = Math.max(0, Math.min(100, (value+delta)/max*100));
  const dTxt = `<span class="d ${delta>0.05?(inverse?'down':'up'):delta<-0.05?(inverse?'up':'down'):''}">${sgn(delta,digits)} ${unit} ${L('за день','per day')}</span>`;
  let right = note;
  if(!inverse && delta < -0.05 && !right){
    const days = value / -delta;
    right = days < 3 ? `<span class="crit">${L(`хватит на ${fmt(days,1)} дн.`,`lasts ${fmt(days,1)} days`)}</span>` : L(`хватит на ~${Math.floor(days)} дн.`,`lasts ~${Math.floor(days)} days`);
  }
  if(inverse && limit){ const left = limit - value; right = `<span class="${left<25?'crit':''}">${L('до лимита','to limit')} ${fmt(left,1)}</span>`; }
  const fc = `<div class="fc">${dTxt}<span>${right}</span></div>`;
  const bars = delta < 0 && !inverse ? `<span class="ghost" style="width:${pct}%;background:${color}"></span><span style="width:${next}%;background:${color}"></span>`
                                     : `<span style="width:${pct}%;background:${color}"></span>${inverse||delta<=0?'':`<span class="ghost" style="width:${next}%;background:${color}"></span>`}`;
  return `<div class="meter" role="group" aria-label="${esc(name)}: ${fmt(value,digits)} ${unit}">
    ${icon}<span class="name">${name}</span><span class="val">${fmt(value,digits)}<small> ${unit}${max&&!inverse&&unit!=='%'?' / '+fmt(max,0):''}</small></span>
    <div class="bar">${bars}${limit?`<span class="limit" style="left:calc(100% - 2px)"></span>`:''}</div>${fc}</div>`;
}

function engineerTip(s, pv){
  const P = PLANETS[s.pid], i = pv.info, n = pv.s;
  const tips = [];
  const days = (v,d)=> d<0 ? v/-d : Infinity;
  if(i.blackout) tips.push([10,L('Энергии не хватит!','Not enough power!'),L(`Расход ${fmt(i.demand,0)} кВт·ч больше, чем есть вместе с батареей. Все системы просядут. `,`Demand of ${fmt(i.demand,0)} kWh is more than you have, battery included. Every system will brown out. `) + (s.mode==='cadet'?L('Выключи радио или убавь кислород: запаса в баках хватит на несколько дней.','Turn off the radio or lower oxygen: the tanks hold a few days’ supply.'):L('Убавь теплицу, очистку воды или радио: кислород и тепло важнее.','Lower the greenhouse, water recycler or radio: oxygen and heat matter more.'))]);
  if(s.leak) tips.push([9,L('Утечка воздуха','Air leak'),L('Через пробоину уходит 1,5 кг кислорода в день. Назначь ремонт.','1.5 kg of oxygen leaks out each day. Assign a repair.')]);
  if(days(s.o2, n.o2-s.o2) < 4) tips.push([9,L('Кислород на исходе','Oxygen running low'),L('Подними мощность электролиза.','Raise electrolysis power.')]);
  if(s.data > 0.01 && s.lv.comm === 0) tips.push([6,L('Данные ждут','Data waiting'),L('Научные данные лежат на базе. Включи радиосвязь, чтобы отправить их на Землю.','Science data is sitting on the base. Turn on the radio to send it to Earth.')]);
  if(s.data < 0.01 && s.lv.comm > 0 && s.action!=='science') tips.push([4,L('Радио работает впустую','Radio is idle'),L(`Отправлять нечего, а радио тратит ${fmt(i.dem.comm,0)} кВт·ч. Можно выключить его до новой вылазки.`,`Nothing to send, yet the radio uses ${fmt(i.dem.comm,0)} kWh. Switch it off until the next sortie.`)]);
  if(s.recyclerBroken) tips.push([9,L('Очистка воды сломана','Water recycler broken'),L('Каждый день без неё уносит десятки литров воды. Назначь ремонт.','Every day without it costs tens of litres. Assign a repair.')]);
  if(isFlare(s, s.day)) tips.push([9,L('Сегодня вспышка','Flare today'),L('Сегодня безопаснее не выходить наружу. Слой реголита, насыпанный утром, защитит уже сегодня.','Better not go outside today. A regolith layer added this morning protects you today.')]);
  if(days(s.water, n.water-s.water) < 4) tips.push([8,L('Мало воды','Low water'),L('Добудь лёд или подними мощность очистки воды.','Mine ice or raise water recycling.')]);
  if(days(s.food, n.food-s.food) < 4) tips.push([8,L('Мало еды','Low food'),L('Включи теплицы на полную или построй ещё одну.','Run greenhouses at full power or build another one.')]);
  if(s.ghBroken>0) tips.push([6,L('Теплица пробита','Greenhouse damaged'),L('Она не даёт ни еды, ни кислорода, пока её не починят.','It gives no food or oxygen until repaired.')]);
  const left = s.sched.flares.filter(d=>d>=s.day);
  if(left.length && s.dose + left.reduce((a,d)=>a+flareDose(s,d),0) + P.bgDose*SHIELD[s.shield]*(P.days-s.day+1) > DOSE_LIMIT*0.85)
    tips.push([7,L('Радиация','Radiation'),L('Если придёт сильная протонная буря, при нынешней защите можно превысить лимит дозы. Насыпь ещё слой реголита.','If a strong proton storm hits, current shielding may not keep you under the dose limit. Add a regolith layer.')]);
  if(i.dark && !i.blackout) tips.push([5,tr(P.darkName),L(`Солнце даёт только ${Math.round(P.darkFactor*100)}% энергии. Следи, чтобы батарея не опустела.`,`The Sun gives only ${Math.round(P.darkFactor*100)}% power. Watch the battery.`)]);
  if(s.pid==='mars' && s.dust>=0.12) tips.push([5,L('Пыль на панелях','Dusty panels'),L(`Пыль съедает ${Math.round(s.dust*100)}% солнечной энергии. Пора чистить.`,`Dust is eating ${Math.round(s.dust*100)}% of solar power. Time to clean.`)]);
  if(s.health < 50) tips.push([6,L('Экипаж устал','Crew is worn out'),L('Дай экипажу отдохнуть: отдых добавляет 10 к здоровью.','Let the crew rest: rest adds 10 health.')]);
  if(s.dose > 70) tips.push([6,L('Высокая доза','High dose'),L('Меньше выходов наружу. Каждый выход добавляет дозу.','Fewer trips outside. Every trip adds dose.')]);
  if(i.wasted > 5) tips.push([3,L('Энергия пропадает','Power is wasted'),L(`${fmt(i.wasted,0)} кВт·ч не влезут в батарею. Добавь аккумулятор или займи энергию делом.`,`${fmt(i.wasted,0)} kWh will not fit in the battery. Add a battery or put the power to work.`)]);
  if(s.science < SCIENCE_GOAL && P.days - s.day + 1 <= SCIENCE_GOAL - s.science + 1) tips.push([4,L('Наука ждёт','Science is waiting'),L(`Для трёх звёзд нужно ${SCIENCE_GOAL} научных результатов, а дней осталось мало.`,`Three stars need ${SCIENCE_GOAL} science results, and few days are left.`)]);
  if(!tips.length){
    const g = [
      [L('Всё в норме','All good'),L('Хороший момент, чтобы построить что-то на будущее или заняться наукой.','A good moment to build for the future or do some science.')],
      [L('Подумай заранее','Plan ahead'),L('Вспышки и тени предупреждают за день. Лучше готовиться до предупреждения.','Flares and shadows come with one day’s warning. Better to prepare before that.')],
      [L('Совет','Tip'),L('Сравни, сколько энергии ест каждая система. Радио нужно только тогда, когда есть что отправить.','Compare how much power each system uses. The radio is only needed when there is data to send.')],
    ][s.day % 3]; tips.push([0,g[0],g[1]]);
  }
  tips.sort((a,b)=>b[0]-a[0]);
  return tips[0];
}

function histHTML(s){
  const H = [{day:0, o2:PLANETS[s.pid].o2, battery:60, batCap:BAT_START_CAP, dose:0}, ...s.history];
  const P = PLANETS[s.pid], W = 400, Ht = 100, x = d => 8 + d/P.days*(W-16), y = v => Ht-6 - Math.max(0,Math.min(1,v))*(Ht-12);
  const line = (fn, col) => `<polyline fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${H.map(h=>`${x(h.day).toFixed(1)},${y(fn(h)).toFixed(1)}`).join(' ')}"/>`;
  const last = H[H.length-1];
  const marks = s.sched.flares.filter(d=>d<s.day).map(d=>`<line x1="${x(d)}" x2="${x(d)}" y1="4" y2="${Ht-4}" stroke="var(--rad)" stroke-dasharray="3 3" opacity=".7" vector-effect="non-scaling-stroke"/>`).join('');
  const darks = s.sched.dark.map((st,i)=>{ const e = Math.min(st+darkLenAt(s,i)-1, s.day-1); return e>=st ? `<rect x="${x(st-0.5)}" y="4" width="${x(e+0.5)-x(st-0.5)}" height="${Ht-8}" fill="var(--muted)" opacity=".12"/>` : ''; }).join('');
  const grid = [0.25,0.5,0.75].map(v=>`<line x1="8" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
  const series = [[h=>h.o2/O2_CAP,'var(--o2)'],[h=>h.battery/(h.batCap||s.batCap),'var(--power)'],[h=>h.dose/DOSE_LIMIT,'var(--rad)']];
  return `<div class="card hist" id="c-hist"><h2>${L('Журнал миссии','Mission log')} <span class="hint">${L('в % от максимума','% of maximum')}</span></h2>
    <svg viewBox="0 0 ${W} ${Ht}" preserveAspectRatio="none" role="img" aria-label="${L('График запасов по дням','Supplies by day')}">${grid}${darks}${marks}${series.map(([f,c])=>line(f,c)).join('')}${series.map(([f,c])=>`<circle cx="${x(last.day)}" cy="${y(f(last))}" r="3.5" fill="${c}"/>`).join('')}</svg>
    <div class="lg"><span><i style="background:var(--o2)"></i>${L('Кислород','Oxygen')}</span><span><i style="background:var(--power)"></i>${L('Батарея','Battery')}</span><span><i style="background:var(--rad)"></i>${L('Доза от лимита','Dose vs limit')}</span><span><i style="background:var(--rad);opacity:.6"></i>${L('пунктир: вспышка','dashed: flare')}</span><span><i style="background:var(--muted);opacity:.5"></i>${L('серый','grey')}: ${tr(P.darkName).toLowerCase()}</span></div></div>`;
}

function trackHTML(s){
  const P = PLANETS[s.pid]; let h = '';
  for(let d=1; d<=P.days; d++){
    const cls = [d<s.day?'done':'', d===s.day?'now':'', (isFlare(s,d) && d<=s.day)?'flare':'', (isDark(s,d) && d<=s.day)?'dark':''].join(' ');
    h += `<i class="${cls}" title="${tr(P.dayName)} ${d}"></i>`;
  }
  return `<div class="track" aria-hidden="true">${h}</div>`;
}

function langBtn(){ return `<button class="btn lang" type="button" data-cmd="lang" aria-label="${L('Switch to English','Переключить на русский')}">${L('EN','RU')}</button>`; }

  const balTxt = i.blackout ? `<span class="res" style="color:var(--bad)">${L('Не хватит','Short by')} ${fmt(i.demand - i.prod - s.battery,0)} ${U.kwh()}</span>`

  const acts = ACTIONS.map(a=>{

    const chips = [];

}

  { sel:'#c-scene', t:()=>L('Тут видна база и подсказки. Солнечные вспышки и тени предупреждают за день. Подготовься заранее!','Here you see the base and tips. Solar flares and shadows come with a day’s warning. Get ready early!') },
  { sel:'#c-end', t:()=>L('Нажми, чтобы прожить день и увидеть, что случилось. Удачи, командир!','Press to live through the day and see what happened. Good luck, commander!') },

function renderTutorial(){

/* ============================================================
   SCENE (canvas)
   ============================================================ */
let anim = null, tAnim = 0;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawScene(){
  const cv = document.getElementById('scene'); if(!cv || !S) return;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const w = cv.clientWidth, h = cv.clientHeight; if(!w||!h) return;
  if(cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  paintBase(c, w, h, S, tAnim);
  const storm = S.pid==='mars' && isDark(S,S.day);
  cancelAnimationFrame(anim);
  if(storm && !reduceMotion){ anim = requestAnimationFrame(t=>{ tAnim = t/1000; drawScene(); }); }
}
function paintBase(c, w, h, s, t){
  const mars = s.pid==='mars', dark = isDark(s, s.day);
  const rng = mulberry32(42);
  const g = c.createLinearGradient(0,0,0,h);
  if(mars){ if(dark){ g.addColorStop(0,'#5a3622'); g.addColorStop(1,'#a0613a'); } else { g.addColorStop(0,'#1c1420'); g.addColorStop(.6,'#6b3b2a'); g.addColorStop(1,'#c27a4f'); } }
  else { g.addColorStop(0,'#000003'); g.addColorStop(1,'#05070f'); }
  c.fillStyle = g; c.fillRect(0,0,w,h);
  if(!mars || !dark){ for(let k=0;k<140;k++){ const x=rng()*w, y=rng()*h*0.62, r=rng()*1.2+0.2; c.fillStyle=`rgba(255,255,255,${mars?0.25*rng():0.35+0.6*rng()})`; c.fillRect(x,y,r,r);} } else { for(let k=0;k<140;k++) rng(); }
  if(!mars){ c.fillStyle='#2f6fcf'; c.beginPath(); c.arc(w*0.82, h*0.2, h*0.055, 0, Math.PI*2); c.fill(); c.fillStyle='rgba(255,255,255,.65)'; c.beginPath(); c.arc(w*0.82-h*0.012, h*0.2-h*0.015, h*0.022, 0, Math.PI*2); c.fill(); }

  c.fillStyle = mars ? (dark?'#7a4a30':'#8e4f33') : '#2a2c33';
  c.beginPath(); c.moveTo(0,h*0.62); for(let x=0;x<=w;x+=w/24){ c.lineTo(x, h*0.6 - Math.sin(x/w*7+1)*h*0.03 - Math.sin(x/w*17)*h*0.012 - (mars?0:Math.max(0,Math.sin(x/w*3.2))*h*0.06)); } c.lineTo(w,h); c.lineTo(0,h); c.fill();
  const gg = c.createLinearGradient(0,h*0.62,0,h);
  if(mars){ gg.addColorStop(0, dark?'#8a5536':'#a65b37'); gg.addColorStop(1, dark?'#5a3522':'#6e3820'); } else { gg.addColorStop(0,'#5d606a'); gg.addColorStop(1,'#33353c'); }
  c.fillStyle = gg; c.beginPath(); c.moveTo(0,h*0.7); for(let x=0;x<=w;x+=w/30){ c.lineTo(x, h*0.69 + Math.sin(x/w*11)*h*0.008); } c.lineTo(w,h); c.lineTo(0,h); c.fill();
  for(let k=0;k<26;k++){ const x=rng()*w, y=h*0.74+rng()*h*0.25, r=(rng()*0.02+0.004)*w; c.fillStyle= mars?'rgba(60,25,10,.35)':'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(x,y,r,r*0.3,0,0,Math.PI*2); c.fill(); }
  const base = h*0.78;
  const S2 = Math.min(w/16, h/8.4);
  const nP = Math.min(s.panels, 16);
  for(let k=0;k<nP;k++){
    const col = k%4, row = Math.floor(k/4);
    const x = w*0.04 + col*S2*1.55 + row*S2*0.35, y = base - row*S2*0.42 + S2*0.2;
    c.fillStyle='#555a66'; c.fillRect(x+S2*0.55, y-S2*0.1, S2*0.08, S2*0.45);
    c.save(); c.translate(x, y-S2*0.55); c.transform(1,0,-0.25,1,0,0);
    const pg = c.createLinearGradient(0,0,S2*1.3,S2*0.6); pg.addColorStop(0, '#2b4c9a'); pg.addColorStop(1, '#16285a');
    c.fillStyle = pg; c.fillRect(0,0,S2*1.3,S2*0.55);
    c.strokeStyle='rgba(180,200,255,.35)'; c.lineWidth=1; for(let q=1;q<4;q++){ c.beginPath(); c.moveTo(q*S2*1.3/4,0); c.lineTo(q*S2*1.3/4,S2*0.55); c.stroke(); }
    if(s.dust>0){ c.fillStyle=`rgba(190,110,70,${s.dust*1.6})`; c.fillRect(0,0,S2*1.3,S2*0.55); }
    if(!dark){ c.fillStyle='rgba(255,255,255,.12)'; c.fillRect(0,0,S2*1.3,S2*0.12); }
    c.restore();
  }
  const hx = w*0.5, hy = base, hw = S2*3.4, hh = S2*1.3;
  for(let Ly=s.shield; Ly>=1; Ly--){
    const e = Ly*S2*0.22;
    c.fillStyle = mars ? ['#7e4126','#8a4a2c','#955233','#a05a39'][Ly-1] : ['#4a4c54','#55575f','#5f626a','#6a6d75'][Ly-1];
    c.beginPath(); c.ellipse(hx, hy, hw/2+e+S2*0.3, hh+e, 0, Math.PI, 0); c.fill();
  }
  c.fillStyle='#d9dde6'; c.beginPath(); c.ellipse(hx, hy, hw/2, hh, 0, Math.PI, 0); c.fill();
  if(s.shield>0){ c.fillStyle = mars ? '#a05a39' : '#6a6d75'; c.globalAlpha = Math.min(0.85, 0.25*s.shield); c.beginPath(); c.ellipse(hx, hy, hw/2, hh, 0, Math.PI, 0); c.fill(); c.globalAlpha=1; }
  const lit = !dark;
  c.fillStyle= lit ? '#ffd88a' : '#6b5a3a'; for(let q=-1;q<=1;q++){ c.beginPath(); c.arc(hx+q*S2*0.7, hy-hh*0.45, S2*0.11, 0, Math.PI*2); c.fill(); }
  c.fillStyle='#b8bdc8'; c.fillRect(hx-S2*0.25, hy-S2*0.55, S2*0.5, S2*0.55);
  const nG = s.mode==='cadet' ? 0 : Math.min(s.gh, 8);
  for(let k=0;k<nG;k++){
    const broken = k >= s.gh - s.ghBroken;
    const on = s.lv.farm>0 && !broken;
    const gx = hx + hw/2 + S2*1.2 + (k%4)*S2*1.25, gy = base - Math.floor(k/4)*S2*0.55 + S2*0.12;
    const dg = c.createRadialGradient(gx, gy-S2*0.2, 0, gx, gy-S2*0.2, S2*0.7);

    c.fillStyle = dg; c.beginPath(); c.ellipse(gx, gy, S2*0.55, S2*0.5, 0, Math.PI, 0); c.fill();
    c.strokeStyle='rgba(220,235,255,.6)'; c.lineWidth=1.2; c.beginPath(); c.ellipse(gx, gy, S2*0.55, S2*0.5, 0, Math.PI, 0); c.stroke();
    if(on){ c.fillStyle='#5fd17a'; for(let q=-2;q<=2;q++){ c.fillRect(gx+q*S2*0.16-1, gy-S2*0.14, 2.5, S2*0.14); } }
    if(broken){ c.strokeStyle='#ff6363'; c.lineWidth=2; c.beginPath(); c.moveTo(gx-S2*0.2,gy-S2*0.42); c.lineTo(gx,gy-S2*0.25); c.lineTo(gx-S2*0.08,gy-S2*0.12); c.lineTo(gx+S2*0.12,gy-S2*0.02); c.stroke(); }
  }
  const nB = Math.min(Math.round((s.batCap-BAT_START_CAP)/BAT_ADD)+1, 8);
  for(let k=0;k<nB;k++){ const bx = hx - hw/2 - S2*1.1 - (k%4)*S2*0.42, by = base + S2*0.25 - Math.floor(k/4)*S2*0.5; c.fillStyle='#3a4150'; c.fillRect(bx, by-S2*0.42, S2*0.32, S2*0.42); c.fillStyle='#ffd35a'; c.fillRect(bx+S2*0.05, by-S2*0.42+S2*0.05+ (1-s.battery/s.batCap)*S2*0.32, S2*0.22, Math.max(1,(s.battery/s.batCap)*S2*0.32)); }
  if(s.reactor){ const rx = w*0.93, ry = h*0.71; c.fillStyle='#c9ced8'; c.fillRect(rx-S2*0.18, ry-S2*0.75, S2*0.36, S2*0.75); c.fillStyle='#8890a0'; for(let q=0;q<4;q++){ c.fillRect(rx-S2*0.7, ry-S2*0.68+q*S2*0.16, S2*0.48, S2*0.08); c.fillRect(rx+S2*0.22, ry-S2*0.68+q*S2*0.16, S2*0.48, S2*0.08);} c.fillStyle='#ffd35a'; c.beginPath(); c.arc(rx, ry-S2*0.85, S2*0.08, 0, Math.PI*2); c.fill(); }
  if(dark && !mars){ c.fillStyle='rgba(0,0,10,.55)'; c.fillRect(0,0,w,h); }
  if(dark && mars){
    c.fillStyle='rgba(160,90,50,.35)'; c.fillRect(0,0,w,h);

  }
}

let reopen = null; // re-renders the open modal after a language switch
function openModal(html, label, again){
  reopen = again || null;
  modalRoot.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="dlg">${html}</div></div>`;
  const first = modalRoot.querySelector('[data-focus]') || modalRoot.querySelector('button');
  if(first) setTimeout(()=>first.focus(), 30);
}
function closeModal(){ modalRoot.innerHTML=''; reopen = null; const b = app.querySelector('[data-cmd="end"]'); if(b) b.focus({preventScroll:true}); renderTutorial(); }

function planetPreview(pid){ return `<canvas data-preview="${pid}" aria-hidden="true"></canvas>`; }
function paintPreviews(){
  modalRoot.querySelectorAll('canvas[data-preview]').forEach(cv=>{
    const pid = cv.dataset.preview; const dpr = Math.min(2, window.devicePixelRatio||1);
    const w = cv.clientWidth, h = cv.clientHeight; if(!w||!h) return; cv.width = w*dpr; cv.height = h*dpr;
    const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
    const fake = newState(pid, 1234, 'engineer'); fake.sched = {dark:[99], darkLens:[1], flares:[99], ev:[SOLAR[0],SOLAR[1]]};
    paintBase(c, w, h, fake, 0);
  });
}
